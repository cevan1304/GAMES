  <title>Our games</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101319'/%3E%3Cpath d='M12 8h8v6h6v8H6v-8h6z' fill='%23f5ce63'/%3E%3Cpath d='M11 16v6m-3-3h6' stroke='%23101319' stroke-width='2'/%3E%3Ccircle cx='21' cy='18' r='1.5' fill='%23101319'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#101319;--surface:#1a1f27;--text:#f5f5f2;--muted:#acb2bd;--gold:#f5ce63;--border:#303741}
    *{box-sizing:border-box}
    html{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#242a36 0%,transparent 65%)}
    .shell{max-width:1240px;margin:auto;padding:40px 40px 30px}
    .masthead{display:flex;align-items:center;gap:12px;padding-bottom:25px;border-bottom:1px solid var(--border)}
    .brand-mark{display:grid;grid-template-columns:repeat(2,7px);gap:4px;transform:rotate(-8deg)}
    .brand-mark i{width:7px;height:7px;background:var(--gold);border-radius:1px}
    .brand{font-size:.875rem;font-weight:700;letter-spacing:.14em}
    .intro{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:44px 0 28px}
    h1{margin:0;font-size:clamp(2rem,5vw,3.25rem);line-height:1.15;letter-spacing:-.04em;font-weight:800}
    .count{font-size:.875rem;color:var(--muted);border:1px solid var(--border);padding:9px 13px;border-radius:30px;white-space:nowrap}
    .games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
    .game{display:flex;flex-direction:column;overflow:hidden;min-width:0;color:inherit;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:18px;transition:border-color .18s,transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .poster{aspect-ratio:16/10;position:relative;overflow:hidden;background:#080b10}
    .poster img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s}
    .game.gyruss .poster img{object-position:center 40%}
    .game.dude .poster img{object-position:center center}
    .game.his .poster img{object-position:center 38%}
    .game.river .poster{background:#26392c}
    .game.river .poster img{object-fit:contain;padding:14px}
    .card-body{display:flex;flex-direction:column;flex:1;padding:25px 24px 23px}
    .genre{margin:0 0 9px;font-size:.875rem;color:var(--muted);line-height:1.5}
    h2{margin:0;font-size:1.625rem;line-height:1.25;letter-spacing:-.03em}
    .play{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:27px;padding:13px 16px;background:var(--gold);color:#171914;border-radius:9px;font-size:1rem;font-weight:700;line-height:1.5}
    .play svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
    .game:focus-visible{outline:3px solid var(--gold);outline-offset:5px}
    .game:active{transform:translateY(1px)}
    .note{display:flex;align-items:center;gap:9px;margin:28px 0 0;color:var(--muted);font-size:.875rem;line-height:1.6}
    .note svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5}
    footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--border);color:#919aa7;font-size:.875rem;line-height:1.6}
    @media(hover:hover){.game:hover{border-color:#b39750;transform:translateY(-5px);box-shadow:0 16px 34px #0003}.game:hover .poster img{transform:scale(1.035)}}
    @media(max-width:920px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:28px 24px}.games{gap:16px}.card-body{padding:20px 18px}h2{font-size:1.4rem}}
    @media(max-width:700px){.shell{max-width:510px;padding:24px 20px 28px}.masthead{padding-bottom:20px}.intro{padding:30px 0 24px}.games{grid-template-columns:1fr;gap:22px}.poster{aspect-ratio:16/9}.card-body{padding:22px}h2{font-size:1.625rem}.play{margin-top:22px}.note{margin-top:24px}footer{margin-top:36px}}
    @media(prefers-reduced-motion:reduce){.game,.poster img{transition:none}.game:hover{transform:none}.game:hover .poster img{transform:none}}
  </style>
</head>
